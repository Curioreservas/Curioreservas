<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CurioReservas | Crear cuenta</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .logo span {
      color: #8b5cf6;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .card {
      background: #0d0d0d;
      border: 1px solid #242424;
      border-radius: 18px;
      padding: 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .intro {
      color: #888;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #ddd;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      background: #080808;
      color: white;
      border: 1px solid #333;
      border-radius: 9px;
      padding: 13px;
      margin-bottom: 18px;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #8b5cf6;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #777;
      font-size: 13px;
    }

    .login a {
      color: #a855f7;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      CURIO<span>RESERVAS</span>
    </div>

    <div class="subtitle">
      by Curiomarketing
    </div>

    <div class="card">

      <h1>Crear mi cuenta</h1>

      <p class="intro">
        Crea tu cuenta y empieza a configurar tu negocio en CurioReservas.
      </p>

      <form id="registerForm">

        <label for="ownerName">
          Tu nombre
        </label>

        <input
          type="text"
          id="ownerName"
          placeholder="Ej. Vianny"
          required
        >

        <label for="businessName">
          Nombre del negocio
        </label>

        <input
          type="text"
          id="businessName"
          placeholder="Ej. Restaurante Curio"
          required
        >

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="tu@email.com"
          required
        >

        <label for="phone">
          Teléfono
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="+34 600 000 000"
          required
        >

        <label for="description">
          Describe tu negocio
        </label>

        <textarea
          id="description"
          placeholder="Cuéntanos brevemente qué tipo de negocio tienes..."
          required
        ></textarea>

        <label for="password">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          placeholder="Mínimo 6 caracteres"
          minlength="6"
          required
        >

        <button type="submit" id="registerButton">
          CREAR MI CUENTA →
        </button>

      </form>

      <div id="message" class="message"></div>

      <div class="login">
        ¿Ya tienes una cuenta?
        <a href="login.html">Iniciar sesión</a>
      </div>

    </div>

  </div>


  <script>

    /* ================================
       CONFIGURACIÓN SUPABASE
       ================================ */

    const SUPABASE_URL =
      "https://jstcvnprvpcizjqdpzes.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzdGN2bnBydnBjaXpqcWRwemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTg3NDEsImV4cCI6MjEwMzIzNDc0MX0.rjP9P2jWKafkBCPzLNd6Bmzr7UAB2fq0Uk3L1xHxByU";


    /* ================================
       ELEMENTOS
       ================================ */

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");


    /* ================================
       MENSAJES
       ================================ */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    /* ================================
       REGISTRO
       ================================ */

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      button.disabled = true;
      button.textContent = "CREANDO CUENTA...";

      message.className = "message";
      message.textContent = "";


      const ownerName =
        document.getElementById("ownerName").value.trim();

      const businessName =
        document.getElementById("businessName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const description =
        document.getElementById("description").value.trim();

      const password =
        document.getElementById("password").value;


      try {

        /* ================================
           CREAR USUARIO EN SUPABASE
           ================================ */

        const response = await fetch(
          SUPABASE_URL + "/auth/v1/signup",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.msg ||
            data.message ||
            "No se pudo crear la cuenta."
          );

        }


        /* ================================
           GUARDAR DATOS DEL NEGOCIO
           ================================ */

        localStorage.setItem(
          "curioreservas_pending_business",
          JSON.stringify({

            ownerName: ownerName,

            businessName: businessName,

            email: email,

            phone: phone,

            description: description

          })
        );


        /* ================================
           ÉXITO
           ================================ */

        showMessage(
          "🎉 ¡Cuenta creada correctamente! Revisa tu correo para confirmar la cuenta.",
          "success"
        );

        button.textContent =
          "CUENTA CREADA ✓";


      } catch (error) {

        console.error(error);

        showMessage(
          "❌ " + error.message,
          "error"
        );

        button.disabled = false;

        button.textContent =
          "CREAR MI CUENTA →";

      }

    });

  </script>

</body>
</html>
