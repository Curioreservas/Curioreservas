<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear mi negocio | CurioReservas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
    }

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      background: #7c3aed;
      opacity: 0.12;
      filter: blur(120px);
      border-radius: 50%;
      right: -120px;
      top: -80px;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 2;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #8b5cf6;
    }

    .by {
      color: #777;
      font-size: 11px;
      margin-top: 5px;
    }

    .card {
      background: #0d0d0d;
      border: 1px solid #252525;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .tag {
      display: inline-block;
      color: #c084fc;
      border: 1px solid #5b21b6;
      background: rgba(124, 58, 237, 0.1);
      padding: 7px 12px;
      border-radius: 50px;
      font-size: 11px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .trial {
      background: rgba(124, 58, 237, 0.1);
      border: 1px solid #4c1d95;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 25px;
      color: #ddd;
      font-size: 13px;
      line-height: 1.5;
    }

    .trial strong {
      color: #c084fc;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      color: #ddd;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      background: #080808;
      border: 1px solid #303030;
      color: #fff;
      border-radius: 10px;
      padding: 13px 14px;
      outline: none;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus,
    textarea:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .button {
      width: 100%;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      margin-top: 8px;
      box-shadow: 0 10px 35px rgba(124, 58, 237, 0.2);
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      border-radius: 10px;
      padding: 12px;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid #7f1d1d;
      color: #fca5a5;
    }

    .message.success {
      display: block;
      background: rgba(22, 163, 74, 0.1);
      border: 1px solid #166534;
      color: #86efac;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 13px;
    }

    .login a {
      color: #a855f7;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover,
    .login a:hover {
      color: #c084fc;
    }

    @media (max-width: 600px) {
      .card {
        padding: 24px 20px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="container">

    <div class="brand">
      <div class="logo">CURIO<span>RESERVAS</span></div>
      <div class="by">by Curiomarketing</div>
    </div>

    <div class="card">

      <div class="tag">✦ EMPIEZA GRATIS</div>

      <h1>Crea tu negocio</h1>

      <p class="subtitle">
        Configura tu negocio en unos minutos y empieza a recibir reservas online.
      </p>

      <div class="trial">
        🎁 <strong>30 días GRATIS.</strong><br>
        Prueba CurioReservas sin compromiso.
      </div>

      <form id="registerForm">

        <div class="field">
          <label for="ownerName">Tu nombre</label>
          <input id="ownerName" type="text" placeholder="Ej. Elena García" required>
        </div>

        <div class="field">
          <label for="businessName">Nombre del negocio</label>
          <input id="businessName" type="text" placeholder="Ej. Barbería Black" required>
        </div>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" placeholder="tu@email.com" required>
        </div>

        <div class="field">
          <label for="phone">Teléfono</label>
          <input id="phone" type="tel" placeholder="Ej. 600 123 456">
        </div>

        <div class="field">
          <label for="description">Descripción del negocio</label>
          <textarea id="description" placeholder="Cuéntanos brevemente qué servicios ofrece tu negocio..."></textarea>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>

        <button class="button" id="registerButton" type="submit">
          CREAR MI NEGOCIO →
        </button>

        <div id="message" class="message"></div>

      </form>

      <div class="login">
        ¿Ya tienes una cuenta?
        <a href="login.html">Iniciar sesión</a>
      </div>

      <a href="index.html" class="back">
        ← Volver a CurioReservas
      </a>

    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://jstcvnprvpcizjqdpzes.supabase.co";

    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzdGN2bnBydnBjaXpqcWRwemVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTg3NDEsImV4cCI6MjEwMzIzNDc0MX0.rjP9P2jWKafkBCPzLNd6Bmzr7UAB2fq0Uk3L1xHxByU";

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const ownerName = document.getElementById("ownerName").value.trim();
      const businessName = document.getElementById("businessName").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const description = document.getElementById("description").value.trim();
      const password = document.getElementById("password").value;

      if (password.length < 6) {
        showMessage("La contraseña debe tener al menos 6 caracteres.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "CREANDO TU CUENTA...";

      try {

        const signUpResponse = await fetch(
          SUPABASE_URL + "/auth/v1/signup",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY
            },
            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );

        const signUpData = await signUpResponse.json();

        if (!signUpResponse.ok) {
          throw new Error(
            signUpData.msg ||
            signUpData.message ||
            "No se pudo crear la cuenta."
          );
        }
        
        localStorage.setItem(
  "curioreservas_pending_business",
  JSON.stringify({
    ownerName: ownerName,
    businessName: businessName,
    email: email,
    phone: phone,
    description: description
  })
);

        const user = signUpData.user;
        
  showMessage(
    "🎉 ¡Cuenta creada! Revisa tu correo para confirmar tu cuenta. Después podrás iniciar sesión y terminar de configurar tu negocio.",
    "success"
  );

  button.disabled = false;
  button.textContent = "CUENTA CREADA ✓";

  return;
}

        const today = new Date();

        const trialStart = today.toISOString().split("T")[0];

        const trialEndDate = new Date(today);
        trialEndDate.setDate(trialEndDate.getDate() + 30);

        const trialEnd = trialEndDate.toISOString().split("T")[0];

        const businessResponse = await fetch(
          SUPABASE_URL + "/rest/v1/businesses",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY,
              "Authorization": "Bearer " + SUPABASE_ANON_KEY,
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({
              owner_id: user.id,
              name: businessName,
              owner_name: ownerName,
              email: email,
              phone: phone || null,
              description: description || null,
              monthly_price: 12,
              subscription_status: "trial",
              trial_enabled: true,
              trial_start: trialStart,
              trial_end: trialEnd
            })
          }
        );

        if (!businessResponse.ok) {
          const errorData = await businessResponse.json();

          throw new Error(
            errorData.message ||
            "La cuenta se creó, pero no pudimos crear el negocio."
          );
        }

        showMessage(
          "🎉 ¡Tu cuenta y tu negocio se han creado correctamente! Tienes 30 días gratis.",
          "success"
        );

        button.textContent = "¡NEGOCIO CREADO!";
        form.reset();

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Ha ocurrido un error. Inténtalo de nuevo.",
          "error"
        );

        button.disabled = false;
        button.textContent = "CREAR MI NEGOCIO →";
      }

    });
  </script>

</body>
</html>
