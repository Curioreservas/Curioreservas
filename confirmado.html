<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Correo confirmado | CurioReservas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #0d0d0d;
      border: 1px solid #252525;
      border-radius: 22px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 0 40px rgba(124, 58, 237, 0.12);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 35px;
    }

    .logo span {
      color: #8b5cf6;
    }

    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 25px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid #7c3aed;
      color: #c084fc;
      font-size: 34px;
      font-weight: bold;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 15px;
    }

    p {
      color: #999;
      line-height: 1.6;
      font-size: 15px;
    }

    .highlight {
      color: #c084fc;
      font-weight: bold;
    }

    .button {
      width: 100%;
      margin-top: 30px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.92;
    }

    .footer {
      margin-top: 25px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        CURIO<span>RESERVAS</span>
      </div>

      <div class="check">
        ✓
      </div>

      <h1>
        ¡Correo confirmado!
      </h1>

      <p>
        Tu correo ha sido
        <span class="highlight">
          confirmado exitosamente
        </span>.
      </p>

      <p style="margin-top: 10px;">
        Ya puedes iniciar sesión y comenzar
        a configurar tu negocio.
      </p>

      <button
        class="button"
        onclick="window.location.href='login.html'"
      >
        INICIAR SESIÓN →
      </button>

      <div class="footer">
        CurioReservas · by Curiomarketing
      </div>

    </div>

  </div>

</body>
</html>
