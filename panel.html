<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi negocio | CurioReservas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
      padding: 30px 18px;
    }
    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }
    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .logo span {
      color: #8b5cf6;
    }
    .subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 35px;
    }
    .card {
      background: #0d0d0d;
      border: 1px solid #252525;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
    }
    .tag {
      display: inline-block;
      color: #c084fc;
      border: 1px solid #5b21b6;
      background: rgba(124, 58, 237, 0.1);
      padding: 7px 12px;
      border-radius: 50px;
      font-size: 11px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    p {
      color: #888;
      line-height: 1.6;
    }
    .status {
      margin-top: 25px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(124, 58, 237, 0.08);
      border: 1px solid #3b1d70;
    }
    .status strong {
      color: #c084fc;
    }
    .button {
      margin-top: 25px;
      width: 100%;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
    }
    .button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
    .message.success,
    .message.error {
      display: block;
    }
    .message.success {
      background: rgba(22, 163, 74, 0.1);
      border: 1px solid #166534;
      color: #86efac;
    }
    .message.error {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid #7f1d1d;
      color: #fca5a5;
    }
    .logout {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #888;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      CURIO<span>RESERVAS</span>
    </div>
    <div class="subtitle">
      Panel de tu negocio · by Curiomarketing
    </div>
    <div class="card">
      <div class="tag">✦ PANEL DE NEGOCIO</div>
      <h1 id="welcome">Cargando...</h1>
      <p>
        Estamos preparando tu espacio de CurioReservas.
      </p>
      <div class="status">
        <strong>🎁 Demo gratuita de 30 días</strong>
        <p>
          Tu negocio tendrá acceso de prueba durante 30 días.
        </p>
      </div>
      <button id="createButton" class="button" disabled>
        COMPROBANDO SESIÓN...
      </button>
      <div id="message" class="message"></div>
      <a href="index.html" class="logout">
        ← Volver a CurioReservas
      </a>
    </div>
  </div>
  <script>
    const SUPABASE_URL =
      "https://jstcvnprvpcizjqdpzes.supabase.co";
    const SUPABASE_ANON_KEY =
      "sb_publishable_RhkydSq-oeSxpNJ5LRVZQg_yiQvdBKc";
    const welcome = document.getElementById("welcome");
    const button = document.getElementById("createButton");
    const message = document.getElementById("message");
    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }
    async function loadSession() {
      const accessToken = sessionStorage.getItem(
        "curioreservas_access_token"
      );
      const savedUser = sessionStorage.getItem(
        "curioreservas_user"
      );
      if (!accessToken || !savedUser) {
        welcome.textContent = "Sesión no encontrada";
        showMessage(
          "Tu sesión no está disponible. Inicia sesión nuevamente.",
          "error"
        );
        button.disabled = true;
        button.textContent = "INICIA SESIÓN NUEVAMENTE";
        return;
      }
      let user;
      try {
        user = JSON.parse(savedUser);
      } catch (error) {
        welcome.textContent = "Error de sesión";
        showMessage(
          "No pudimos leer tu sesión. Inicia sesión nuevamente.",
          "error"
        );
        button.disabled = true;
        return;
      }
      welcome.textContent = "¡Bienvenida! 👋";
      button.disabled = false;
      button.textContent = "CREAR MI NEGOCIO →";
      button.onclick = function () {
        createBusiness(user, accessToken);
      };
    }
    async function createBusiness(user, accessToken) {
      button.disabled = true;
      button.textContent = "COMPROBANDO TU NEGOCIO...";
      try {
        const headers = {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + accessToken
        };
        // Primero comprobamos si ya existe un negocio del usuario.
        let response = await fetch(
          SUPABASE_URL +
          "/rest/v1/businesses?owner_id=eq." +
          encodeURIComponent(user.id) +
          "&select=*&limit=1",
          { headers }
        );
        
        if (!response.ok) {
          const detalle = await response.text();

          throw new Error(
            "Error de Supabase (" +
            response.status +
            "): " +
            detalle
          );
        }

        let businesses = await response.json();
        // Si no aparece por propietario, buscamos por correo.
        if (!businesses.length && user.email) {
          response = await fetch(
            SUPABASE_URL +
            "/rest/v1/businesses?email=eq." +
            encodeURIComponent(user.email) +
            "&select=*&limit=1",
            { headers }
          );
          if (!response.ok) {
            throw new Error(
              "No pudimos comprobar el negocio por correo."
            );
          }
          businesses = await response.json();
        }
        // Si ya existe, abrimos el panel sin duplicarlo.
        if (businesses.length > 0) {
          window.location.href = "panel-negocios.html";
          return;
        }
        // Si no existe, recuperamos los datos del registro.
        const pending = localStorage.getItem(
          "curioreservas_pending_business"
        );
        if (!pending) {
          throw new Error(
            "No encontramos un negocio existente ni los datos " +
            "pendientes para crearlo. No se ha creado ningún registro nuevo."
          );
        }
        const business = JSON.parse(pending);
        if (!business.businessName || !business.email) {
          throw new Error(
            "Faltan el nombre o el correo del negocio. " +
            "Vuelve a revisar el registro."
          );
        }
        const startDate = new Date();
        const endDate = new Date(startDate);
        endDate.setDate(endDate.getDate() + 30);
        button.textContent = "CREANDO TU NEGOCIO...";
        response = await fetch(
          SUPABASE_URL + "/rest/v1/businesses",
          {
            method: "POST",
            headers: {
              ...headers,
              "Content-Type": "application/json",
              "Prefer": "return=representation"
            },
            body: JSON.stringify({
              owner_id: user.id,
              owner_name: user.email,
              Name: business.businessName,
              email: business.email || user.email,
              Phone: business.phone,
              Description: business.description,
              monthly_price: 9.99,
              Subscription_status: "trial",
              trial_enabled: true,
              Trial_start: startDate.toISOString(),
              Trial_end: endDate.toISOString()
            })
          }
        );
        const result = await response.json();
        if (!response.ok) {
          throw new Error(
            result.message ||
            result.details ||
            result.hint ||
            "No se pudo crear el negocio en Supabase."
          );
        }
        // Limpiamos los datos pendientes solo tras crearlo.
        localStorage.removeItem(
          "curioreservas_pending_business"
        );
        // Abrimos el panel nuevo.
        window.location.href = "panel-negocios.html";
      } catch (error) {
        console.error("Error de CurioReservas:", error);
        showMessage(
          error.message || "Ha ocurrido un error.",
          "error"
        );
        button.disabled = false;
        button.textContent = "INTENTAR DE NUEVO →";
      }
    }
    loadSession();
  </script>
</body>
</html>
